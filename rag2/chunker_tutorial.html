<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>切分演示：把文章切成小块</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #f0f4f8; margin: 0; color: #333; }
  .page { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 14px; margin-bottom: 18px; }
  .stage { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .talk { background: #fff3cd; border-radius: 10px; padding: 12px 14px; font-size: 16px; line-height: 1.6; margin-bottom: 16px; }
  .talk b { color: #c0392b; }
  .block { margin-bottom: 16px; }
  .label { font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 700; }
  .paras, .basketbox, .chunks { display: flex; flex-wrap: wrap; gap: 8px; }
  .para { background: #a29bfe; color: #fff; border-radius: 10px; padding: 10px 12px; font-size: 14px; text-align: center; }
  .para small { display: block; opacity: .85; font-size: 11px; margin-top: 3px; }
  .para.cur { background: #e17055; transform: scale(1.05); }
  .basket { border: 3px dashed #0984e3; border-radius: 12px; min-height: 58px; padding: 8px; background: #dff9fb; width: 100%; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .basket .empty { color: #0984e3; font-size: 14px; padding: 8px; }
  .basket .tail { background: #feca57; color: #333; border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  .basket .item { background: #74b9ff; color: #fff; border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  .chunk { background: #e8f8f0; border: 2px solid #55efc4; border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.5; }
  .chunk b { color: #00b894; }
  .chunk.new { border-color: #00b894; background: #d5f5e3; }
  .btns { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button { border: none; border-radius: 10px; padding: 12px 22px; font-size: 15px; cursor: pointer; background: #0984e3; color: #fff; }
  button:hover { opacity: .88; }
  button.gray { background: #b2bec3; color: #333; }
  button.green { background: #00b894; }
  .stepno { font-size: 13px; color: #aaa; margin-top: 10px; }
  .code-toggle { margin-top: 24px; text-align: center; }
  .code-toggle button { background: #636e72; font-size: 13px; padding: 8px 14px; }
  #codeBox { display: none; margin-top: 12px; background: #1e272e; color: #d2dae2; border-radius: 10px; padding: 14px; font-size: 12px; line-height: 1.6; overflow: auto; white-space: pre; }
</style>
</head>
<body>
<div class="page">
  <h1>切分（chunker）：把长文章切成小块</h1>
  <div class="sub">演示用 4 段小文字。每块最多装 12 个字，新块带上上一块最后 4 个字（尾巴）。</div>

  <div class="stage">
    <div class="talk" id="talk"></div>

    <div class="block">
      <div class="label">文章分成的段落（一段一个卡片）</div>
      <div class="paras" id="paras"></div>
    </div>

    <div class="block">
      <div class="label">篮子（正在装的一块）<span id="basketLabel"></span></div>
      <div class="basketbox"><div class="basket" id="basket"></div></div>
    </div>

    <div class="block">
      <div class="label">已经打包好的块</div>
      <div class="chunks" id="chunks"></div>
    </div>

    <div class="btns">
      <button class="gray" id="prevBtn" onclick="prev()">上一步</button>
      <button id="nextBtn" onclick="next()">下一步</button>
      <button class="green" id="playBtn" onclick="autoPlay()">自动演示</button>
      <button onclick="resetAll()" style="background:#e17055">重新开始</button>
    </div>
    <div class="stepno" id="stepno"></div>
  </div>

  <div class="code-toggle">
    <button onclick="toggleCode()">显示/隐藏：真正的 chunker.py 代码（现在不用看懂）</button>
    <div id="codeBox"></div>
  </div>
</div>

<script>
const PARAS = ["今天天气很好。", "我们一起去公园。", "公园里有花有树。", "还有一条小河。"];
const MAX = 12, OV = 4;

// 按 chunker.py 的逻辑模拟每一步
function buildSteps() {
  const steps = [];
  let chunks = [], buf = [], bufLen = 0;
  const state = () => ({ chunks: chunks.map(c => c), buf: [...buf], bufLen });
  steps.push({ s: state(), msg: "开始：文章按空行切成了 4 段。", cur: -1 });
  for (let i = 0; i < PARAS.length; i++) {
    const p = PARAS[i];
    if (buf.length && bufLen + p.length + 1 > MAX) {
      steps.push({ s: state(), msg: `处理第 ${i + 1} 段「${p}」：<b>篮子满了</b>，先把篮子打包成块。`, cur: i });
      chunks.push(buf.join("\n"));
      steps.push({ s: state(), msg: `打包完成：块${chunks.length} = ${buf.join(" + ")}。`, cur: i });
      const tail = buf[buf.length - 1].slice(-OV);
      buf = [tail]; bufLen = tail.length;
      steps.push({ s: state(), msg: `新篮子只带上上一段的尾巴「${tail}」，然后继续装。`, cur: i });
    }
    buf.push(p);
    bufLen += p.length + 1;
    steps.push({ s: state(), msg: `把第 ${i + 1} 段「${p}」<b>放进篮子</b>。篮子现在 ${buf.length} 个东西。`, cur: i });
  }
  if (buf.length) {
    steps.push({ s: state(), msg: "所有段落都处理完了，篮子里还有东西，<b>最后打包一次</b>。", cur: -1 });
    chunks.push(buf.join("\n"));
  }
  steps.push({ s: state(), msg: `完成！一共切成 <b>${chunks.length} 块</b>。`, cur: -1 });
  return steps;
}

let steps = [], idx = 0, timer = null;

function render() {
  const st = steps[idx];
  document.getElementById("talk").innerHTML = st.msg;
  document.getElementById("stepno").textContent = `第 ${idx + 1} / ${steps.length} 步`;

  document.getElementById("paras").innerHTML = PARAS.map((p, i) =>
    `<div class="para ${i === st.cur ? 'cur' : ''}">${i + 1}. ${p}<small>${p.length} 字</small></div>`).join("");

  const b = document.getElementById("basket");
  if (st.s.buf.length === 0) {
    b.innerHTML = `<span class="empty">（空篮子）</span>`;
  } else {
    b.innerHTML = st.s.buf.map((x, i) =>
      (st.s.buf.length > 1 && i === 0) ? `<span class="tail">尾巴：${x}</span>` : `<span class="item">${x}</span>`).join("");
  }
  document.getElementById("basketLabel").textContent = `（${st.s.bufLen} 字）`;

  document.getElementById("chunks").innerHTML = st.s.chunks.length
    ? st.s.chunks.map((c, i) => `<div class="chunk ${i === st.s.chunks.length - 1 ? 'new' : ''}"><b>块${i + 1}</b>（${c.length} 字）<br>${c.replace(/\n/g, " + ")}</div>`).join("")
    : `<span style="color:#aaa">还没有块</span>`;
}

function next() { if (idx < steps.length - 1) { idx++; render(); } }
function prev() { if (idx > 0) { idx--; render(); } }
function resetAll() { stop(); steps = buildSteps(); idx = 0; render(); }
function stop() { if (timer) { clearInterval(timer); timer = null; document.getElementById("playBtn").textContent = "自动演示"; } }
function autoPlay() {
  if (timer) { stop(); return; }
  document.getElementById("playBtn").textContent = "暂停";
  timer = setInterval(() => { if (idx >= steps.length - 1) { stop(); return; } idx++; render(); }, 1800);
}
function toggleCode() {
  const box = document.getElementById("codeBox");
  if (box.style.display === "block") { box.style.display = "none"; return; }
  box.style.display = "block";
  if (!box.textContent) box.textContent = CODE;
}

const CODE = `# -*- coding: utf-8 -*-
"""文本切分：按段落贪心打包成块，块间带重叠，保留来源"""
import re

def _split_long(paragraph, chunk_size):
    parts = re.split(r"(?<=[。！？；])", paragraph)
    pieces, cur = [], ""
    for part in parts:
        if len(part) > chunk_size:
            if cur:
                pieces.append(cur)
                cur = ""
            for i in range(0, len(part), chunk_size):
                pieces.append(part[i:i + chunk_size])
        elif cur and len(cur) + len(part) > chunk_size:
            pieces.append(cur)
            cur = part
        else:
            cur += part
    if cur:
        pieces.append(cur)
    return pieces

def chunk_text(text, source, chunk_size=300, overlap=50):
    paragraphs = [p.strip() for p in text.split("\\n\\n") if p.strip()]
    chunks, buf, buf_len = [], [], 0

    for para in paragraphs:
        if len(para) > chunk_size:
            if buf:
                chunks.append("\\n".join(buf))
                buf, buf_len = [], 0
            for sub in _split_long(para, chunk_size):
                chunks.append(sub)
            continue

        if buf and buf_len + len(para) + 1 > chunk_size:
            chunks.append("\\n".join(buf))
            tail = buf[-1] if buf else ""
            tail = tail[-overlap:] if len(tail) > overlap else tail
            buf, buf_len = ([tail] if tail else []), len(tail)

        buf.append(para)
        buf_len += len(para) + 1

    if buf:
        chunks.append("\\n".join(buf))

    return [{"text": c, "source": source} for c in chunks if c.strip()]`;

resetAll();
</script>
</body>
</html>
