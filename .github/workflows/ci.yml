name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 快速档：离线单测 + 语法编译（每次 push 都跑，1-2 分钟） ----------
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 装离线依赖
        run: |
          python -m pip install -U pip
          pip install requests tomli
          pip install -r offeragent/requirements.txt
      - name: 全仓库语法编译
        run: python -m compileall -q . || (python -m compileall . ; exit 1)
      - name: 统一离线测试入口
        run: python run_tests.py

  # ---------- 服务档：真建索引 + 起 HTTP 服务 + 打鉴权/限流/探针 ----------
  service:
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 装服务依赖（CPU 版 torch）
        run: |
          python -m pip install -U pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r rag2/requirements-service.txt
      - name: 建索引（CI 里允许联网下模型）
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
          RAG2_CHROMA_DIR: ${{ runner.temp }}/chroma
        run: python rag2/build_index.py
      - name: 服务生产化验收（鉴权/限流/探针/结构化错误 13 项）
        env:
          SERVICE_RATE_LIMIT: "3"
          RAG2_CHROMA_DIR: ${{ runner.temp }}/chroma
        run: python rag2/test_service_prod.py

  # ---------- 镜像档：真 docker build + 起容器 + 打探针（重，按需跑） ----------
  # ---------- Java 档：SpringBoot 对外 API 层（java-api）编译 + 接口测试 ----------
  java-api:
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 编译并跑接口测试（岗位过滤 / 参数校验返回 400）
        working-directory: java-api
        run: mvn -B test

  docker:
    runs-on: ubuntu-latest
    needs: offline
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装校验依赖（PyYAML 供 Docker 配置静态校验）
        run: pip install PyYAML
      - name: Docker 真构建验收（rag2 + OfferAgent）
        env:
          RUN_DOCKER_BUILD: "1"
        run: python test_docker_build.py
