<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="880" viewBox="0 0 1060 880" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <title>OfferAgent 系统架构图</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4F6B9A"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#C4554D"/>
    </marker>
  </defs>
  <rect width="1060" height="880" fill="#F7F7F5"/>

  <!-- 标题 -->
  <text x="530" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1A1B1C">OfferAgent · 系统架构（Agent 引擎层 + 多 Agent 协作）</text>
  <text x="530" y="64" text-anchor="middle" font-size="13" fill="#5F6670">认识自己 → 找岗位 → 投递 → 复盘 → 更新自己 ｜ 投递动作永远人确认</text>

  <!-- ========== 第一层：画像地基 ========== -->
  <rect x="60" y="92" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#4F6B9A" stroke-width="1.5"/>
  <text x="180" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1B1C">素材 me.txt</text>
  <text x="180" y="140" text-anchor="middle" font-size="12" fill="#5F6670">经历 / 技能 / 项目 / 硬约束</text>
  <text x="180" y="156" text-anchor="middle" font-size="12" fill="#5F6670">（禁止编造，只蒸馏事实）</text>

  <line x1="300" y1="128" x2="388" y2="128" stroke="#4F6B9A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="344" y="118" text-anchor="middle" font-size="11" fill="#4F6B9A">Self-Distill</text>

  <rect x="392" y="92" width="280" height="72" rx="8" fill="#FFFFFF" stroke="#4F6B9A" stroke-width="1.5"/>
  <text x="532" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1B1C">① 画像 profile.md（结构化）</text>
  <text x="532" y="140" text-anchor="middle" font-size="12" fill="#5F6670">基本信息 / 技能 / 项目 / 求职目标 / 优势 / 不足 / 硬约束</text>
  <text x="532" y="156" text-anchor="middle" font-size="12" fill="#5F6670">一切下游（匹配 / 话术 / 复盘）的地基</text>

  <line x1="672" y1="128" x2="760" y2="128" stroke="#4F6B9A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="716" y="118" text-anchor="middle" font-size="11" fill="#4F6B9A">蒸馏</text>

  <rect x="764" y="92" width="236" height="72" rx="8" fill="#FFFFFF" stroke="#4F6B9A" stroke-width="1.5"/>
  <text x="882" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1B1C">② 岗位库</text>
  <text x="882" y="138" text-anchor="middle" font-size="12" fill="#5F6670">jd_fetcher 多来源抓取</text>
  <text x="882" y="154" text-anchor="middle" font-size="12" fill="#5F6670">job_quality 7 规则防僵尸岗</text>

  <!-- 箭头到引擎层 -->
  <line x1="180" y1="164" x2="180" y2="210" stroke="#4F6B9A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="882" y1="164" x2="882" y2="210" stroke="#4F6B9A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="532" y1="164" x2="532" y2="210" stroke="#4F6B9A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== 第二层：单 Agent 引擎 ========== -->
  <rect x="60" y="214" width="940" height="212" rx="10" fill="#FFFFFF" stroke="#4F6B9A" stroke-width="1.5"/>
  <text x="82" y="240" font-size="14" font-weight="bold" fill="#1A1B1C">③ Agent 引擎层（单 Agent 自主闭环）</text>
  <text x="82" y="260" font-size="12" fill="#5F6670">模型自主规划工具链 → 根据中间结果决定下一步 → 全程 trace → 停在人确认</text>

  <!-- 工具链 -->
  <rect x="80" y="278" width="132" height="56" rx="8" fill="#EEF2F8" stroke="#4F6B9A" stroke-width="1.2"/>
  <text x="146" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1B1C">assess_job</text>
  <text x="146" y="320" text-anchor="middle" font-size="11" fill="#5F6670">岗位质量 7 规则</text>

  <line x1="212" y1="306" x2="238" y2="306" stroke="#4F6B9A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="242" y="278" width="132" height="56" rx="8" fill="#EEF2F8" stroke="#4F6B9A" stroke-width="1.2"/>
  <text x="308" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1B1C">split_jd</text>
  <text x="308" y="320" text-anchor="middle" font-size="11" fill="#5F6670">JD 拆职责/要求</text>

  <line x1="374" y1="306" x2="400" y2="306" stroke="#4F6B9A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="404" y="278" width="150" height="56" rx="8" fill="#EEF2F8" stroke="#4F6B9A" stroke-width="1.2"/>
  <text x="479" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1B1C">match_job</text>
  <text x="479" y="320" text-anchor="middle" font-size="11" fill="#5F6670">匹配度 % + 门禁裁决</text>
  <text x="479" y="332" text-anchor="middle" font-size="10" fill="#C4554D">GATE_SCORE=60</text>

  <line x1="554" y1="306" x2="580" y2="306" stroke="#4F6B9A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="584" y="278" width="150" height="56" rx="8" fill="#EEF2F8" stroke="#4F6B9A" stroke-width="1.2"/>
  <text x="659" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1B1C">generate_talk</text>
  <text x="659" y="320" text-anchor="middle" font-size="11" fill="#5F6670">BOSS/微信/邮件话术</text>

  <line x1="734" y1="306" x2="760" y2="306" stroke="#4F6B9A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="764" y="278" width="150" height="56" rx="8" fill="#EEF2F8" stroke="#4F6B9A" stroke-width="1.2"/>
  <text x="839" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1B1C">check_talk</text>
  <text x="839" y="320" text-anchor="middle" font-size="11" fill="#5F6670">禁用词校验+重写</text>

  <!-- 开投递（人确认） -->
  <line x1="839" y1="334" x2="839" y2="360" stroke="#C4554D" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <rect x="764" y="364" width="150" height="46" rx="8" fill="#FBF0EE" stroke="#C4554D" stroke-width="1.5"/>
  <text x="839" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4554D">open_application 🔒</text>
  <text x="839" y="401" text-anchor="middle" font-size="11" fill="#C4554D">执行前核验链接 · 人确认</text>

  <!-- 记忆 / trace / 门禁 -->
  <rect x="80" y="364" width="290" height="46" rx="8" fill="#F2F6F2" stroke="#35705A" stroke-width="1.2"/>
  <text x="225" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#35705A">记忆 Memory · SQLite 跨会话</text>
  <text x="225" y="401" text-anchor="middle" font-size="11" fill="#35705A">事实表 + 对话表 · 进程外持久化</text>

  <rect x="404" y="364" width="290" height="46" rx="8" fill="#F2F6F2" stroke="#35705A" stroke-width="1.2"/>
  <text x="549" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#35705A">trace 可观测</text>
  <text x="549" y="401" text-anchor="middle" font-size="11" fill="#35705A">每步工具/参数/结果/成败 → 复盘与评估</text>

  <!-- ========== 第三层：多 Agent ========== -->
  <rect x="60" y="450" width="940" height="190" rx="10" fill="#FFFFFF" stroke="#35705A" stroke-width="1.5"/>
  <text x="82" y="476" font-size="14" font-weight="bold" fill="#1A1B1C">④ 多 Agent 协作（主管分派 · Supervisor pattern）</text>
  <text x="82" y="496" font-size="12" fill="#5F6670">主管只有一个工具 dispatch；每个子 Agent 是独立 run_agent 实例（独立状态 / 工具集 / 角色提示词）</text>

  <rect x="80" y="514" width="180" height="62" rx="8" fill="#4F6B9A"/>
  <text x="170" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">主管 Supervisor</text>
  <text x="170" y="560" text-anchor="middle" font-size="11" fill="#E8EEF8">拆任务 → dispatch → 汇总</text>

  <line x1="260" y1="545" x2="300" y2="545" stroke="#4F6B9A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="535" text-anchor="middle" font-size="11" fill="#4F6B9A">dispatch</text>

  <rect x="304" y="514" width="200" height="62" rx="8" fill="#EEF2F8" stroke="#4F6B9A" stroke-width="1.2"/>
  <text x="404" y="538" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1B1C">岗位分析师</text>
  <text x="404" y="556" text-anchor="middle" font-size="11" fill="#5F6670">assess / split / match</text>
  <text x="404" y="570" text-anchor="middle" font-size="10" fill="#5F6670">→ 匹配分 + 门禁建议</text>

  <line x1="504" y1="545" x2="544" y2="545" stroke="#4F6B9A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="524" y="535" text-anchor="middle" font-size="11" fill="#4F6B9A">dispatch</text>

  <rect x="548" y="514" width="200" height="62" rx="8" fill="#EEF2F8" stroke="#4F6B9A" stroke-width="1.2"/>
  <text x="648" y="538" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1B1C">话术专家</text>
  <text x="648" y="556" text-anchor="middle" font-size="11" fill="#5F6670">generate / check</text>
  <text x="648" y="570" text-anchor="middle" font-size="10" fill="#5F6670">→ 最终话术全文</text>

  <line x1="748" y1="545" x2="788" y2="545" stroke="#4F6B9A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="768" y="535" text-anchor="middle" font-size="11" fill="#4F6B9A">dispatch</text>

  <rect x="792" y="514" width="188" height="62" rx="8" fill="#EEF2F8" stroke="#4F6B9A" stroke-width="1.2"/>
  <text x="886" y="538" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1B1C">投递复盘员</text>
  <text x="886" y="556" text-anchor="middle" font-size="11" fill="#5F6670">review_status / funnel</text>
  <text x="886" y="570" text-anchor="middle" font-size="10" fill="#5F6670">/ needs_followup</text>

  <!-- 复盘员接岗位库 -->
  <path d="M 886 576 C 886 610, 940 612, 940 640 L 940 700" fill="none" stroke="#35705A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="948" y="640" font-size="11" fill="#35705A" transform="rotate(90 948 640)">读真实岗位库</text>

  <!-- 子 Agent 安全说明 -->
  <text x="82" y="600" font-size="11" fill="#C4554D">安全边界：open_application 不在任何子 Agent 工具集里 —— 投递永远由人确认</text>
  <text x="82" y="618" font-size="11" fill="#5F6670">子 Agent 结果回填主管（摘要 + match_score + verdict），主管出最终中文汇总</text>

  <!-- ========== 第四层：落盘 ========== -->
  <line x1="180" y1="426" x2="180" y2="470" stroke="#4F6B9A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="532" y1="426" x2="532" y2="470" stroke="#4F6B9A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="664" width="940" height="86" rx="10" fill="#FFFFFF" stroke="#35705A" stroke-width="1.5"/>
  <text x="82" y="690" font-size="14" font-weight="bold" fill="#1A1B1C">⑤ 落盘与复盘闭环</text>

  <rect x="80" y="704" width="250" height="34" rx="6" fill="#F2F6F2" stroke="#35705A" stroke-width="1.2"/>
  <text x="205" y="726" text-anchor="middle" font-size="12" fill="#1A1B1C">agent_logs.jsonl（含裁决）</text>

  <rect x="360" y="704" width="250" height="34" rx="6" fill="#F2F6F2" stroke="#35705A" stroke-width="1.2"/>
  <text x="485" y="726" text-anchor="middle" font-size="12" fill="#1A1B1C">memory.db（跨会话记忆）</text>

  <rect x="640" y="704" width="250" height="34" rx="6" fill="#F2F6F2" stroke="#35705A" stroke-width="1.2"/>
  <text x="765" y="726" text-anchor="middle" font-size="12" fill="#1A1B1C">jds/*.meta.json（岗位状态）</text>

  <!-- 底部 -->
  <text x="530" y="820" text-anchor="middle" font-size="12" fill="#5F6670">工程化三件套：可复用（工具=产品能力）· 可审计（trace+日志）· 人机安全边界（human_confirm）</text>
  <text x="530" y="842" text-anchor="middle" font-size="12" fill="#5F6670">参考：LangGraph（State/循环）· OpenAI Agents SDK（工具注册表）· CrewAI（角色化子 Agent）</text>
</svg>
