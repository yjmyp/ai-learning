[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
baseRadius = "small"
showWidgetBorder = true

[server]
headless = true

[client]
# 公网名片页要把 Streamlit 自己的工具栏收起来，看起来才像个正经作品页
toolbarMode = "minimal"
